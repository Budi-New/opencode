plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
android {
    namespace 'id.my.cyberpos'
    compileSdk 34
    defaultConfig {
        applicationId 'id.my.cyberpos'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }
    buildTypes { release { minifyEnabled false }; debug { } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
}
dependencies {
    constraints { implementation('org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.22'); implementation('org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.22') }
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.webkit:webkit:1.10.0'
    implementation 'androidx.security:security-crypto:1.1.0'
}
